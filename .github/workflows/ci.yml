name: CI

# Lint, test and build every pull request, so a broken build shows up as a red check
# before it reaches a Vercel deployment.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build against the staging backend, like Vercel previews.
      NEXT_PUBLIC_API_URL: https://staging-admin.exohaven-iq.com
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
